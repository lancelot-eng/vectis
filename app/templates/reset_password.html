<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Vectis</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;">
  <div style="max-width:380px; width:100%;">
    <h1 style="font-size:1.5rem; margin-bottom:8px;">Nouveau mot de passe</h1>
    <p style="color:var(--text-dim); font-size:0.9rem; margin-bottom:28px;">Choisissez un nouveau mot de passe pour votre compte.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div style="color:var(--alert); font-size:0.85rem; margin-bottom:16px; padding:10px 12px; border:1px solid var(--alert); background:color-mix(in srgb, var(--alert) 10%, transparent);">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" style="display:flex; flex-direction:column; gap:16px;">
      <div class="field">
        <label style="display:block; font-size:0.78rem; color:var(--text-dim); margin-bottom:6px;">Nouveau mot de passe</label>
        <input type="password" name="password" minlength="8" required
          style="width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:11px 14px; font-size:0.9rem;">
      </div>
      <button type="submit" class="modal-submit">Valider</button>
    </form>
  </div>
</div>
</body>
</html>
