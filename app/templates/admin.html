<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — Vectis</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
<style>
.admin-shell { max-width: 900px; margin: 0 auto; padding: 48px 32px; }
.admin-table { border: 1px solid var(--border); width: 100%; border-collapse: collapse; }
.admin-table th { text-align: left; font-size: 0.75rem; color: var(--text-faint); text-transform: uppercase; padding: 12px 16px; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; }
.admin-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
.admin-table tr:last-child td { border-bottom: none; }
.role-select { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; font-size: 0.82rem; font-family: 'Inter', sans-serif; }
.badge-verified { color: var(--signal); font-size: 0.75rem; }
.badge-unverified { color: var(--text-faint); font-size: 0.75rem; }
</style>
</head>
<body>

<header>
  <div class="logo-block" onclick="window.location.href='/'">
    <div class="logo-mark">
      <svg viewBox="0 0 34 34" fill="none">
        <path d="M4 6 L17 4 L30 6 L28 20 L17 30 L6 20 Z" stroke="var(--accent)" stroke-width="1.6" fill="none"/>
        <path d="M12 16 L15.5 20 L23 11" stroke="var(--signal)" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
      </svg>
    </div>
    <div class="logo-text">vect<span class="cursor-blink">i</span>s</div>
  </div>
  <nav>
    <div class="nav-links"><a href="/">Accueil</a><a href="/support">Support</a></div>
  </nav>
</header>

<div class="admin-shell">
  <h1 style="font-size:1.6rem; margin-bottom:8px;">Administration</h1>
  <p style="color:var(--text-dim); margin-bottom:32px; font-size:0.9rem;">Gestion des comptes et des rôles. Réservé à l'administrateur.</p>

  <table class="admin-table">
    <thead>
      <tr><th>Utilisateur</th><th>E-mail</th><th>Statut</th><th>Rôle</th></tr>
    </thead>
    <tbody id="usersTableBody">
      <tr><td colspan="4" style="text-align:center; color:var(--text-faint);">Chargement…</td></tr>
    </tbody>
  </table>
</div>

<script>
async function loadUsers() {
  const res = await fetch('/api/admin/users');
  if (res.status === 403) {
    document.querySelector('.admin-shell').innerHTML = '<p style="color:var(--alert);">Accès réservé à l\'administrateur.</p>';
    return;
  }
  const users = await res.json();
  const tbody = document.getElementById('usersTableBody');
  tbody.innerHTML = '';

  users.forEach(u => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>@${escapeHtml(u.username)}</td>
      <td>${escapeHtml(u.email)}</td>
      <td>${u.email_verified ? '<span class="badge-verified">Vérifié</span>' : '<span class="badge-unverified">Non vérifié</span>'}</td>
      <td>
        <select class="role-select" onchange="updateRole(${u.id}, this.value)">
          <option value="user" ${u.role === 'user' ? 'selected' : ''}>Utilisateur</option>
          <option value="moderator" ${u.role === 'moderator' ? 'selected' : ''}>Modérateur</option>
          <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
        </select>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

async function updateRole(userId, newRole) {
  const res = await fetch(`/api/admin/users/${userId}/role`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ role: newRole }),
  });
  if (!res.ok) {
    const data = await res.json();
    alert(data.error || "Erreur lors de la mise à jour du rôle.");
    loadUsers();
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadUsers();
</script>

</body>
</html>
